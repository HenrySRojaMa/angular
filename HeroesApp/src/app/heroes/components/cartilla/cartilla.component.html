<mat-card>
    <mat-card-header>
        <mat-card-title>{{item.nombre}}</mat-card-title>
        <mat-card-subtitle>{{item.categoria}} - {{item.tipo}}</mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image [src]="item.imagen" alt="Photo of a Shiba Inu">
    <mat-card-content>
        <p>{{item.estadisticas}}</p>
    </mat-card-content>
    <mat-card-actions>
        <button mat-button [routerLink]="['/heroes',item.id]">Detalle</button>
        <button mat-button [routerLink]="['/heroes/editar',item.id]">Editar</button>
    </mat-card-actions>
</mat-card>
