<mat-grid-list cols="1" *ngIf="!carta;else divInfo">
    <mat-grid-tile>
        <mat-spinner></mat-spinner>
    </mat-grid-tile>
</mat-grid-list>

<ng-template #divInfo>
    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="30px">
        <div fxFlex="50%" fxFlexFill>
            <h1>{{carta.nombre}}</h1>
            <mat-divider></mat-divider>
            <br>
            <img [src]="carta.imagen">
        </div>
        <div fxFlex="50%" fxFlexFill>
            <h1>{{carta.tipo}} - {{carta.categoria}}</h1>
            <mat-divider></mat-divider>
            <mat-list>
                <mat-list-item>
                    {{carta.descipcion}}
                </mat-list-item>
                <mat-list-item>
                    {{carta.estadisticas}}
                </mat-list-item>
                <br>
                <button mat-button color="warn" (click)="regresar()">Regresar</button>
            </mat-list>
        </div>
    </div>
</ng-template>
