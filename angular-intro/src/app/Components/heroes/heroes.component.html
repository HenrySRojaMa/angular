<h1>FUSIONAR {{arquetipo}}</h1>

<dl>
    <dt>Tipo: </dt>
    <dd>{{tipo}}</dd>

    <dt>Nombre: </dt>
    <dd>{{nombre}}</dd>

    <dt>Carta: </dt>
    <dd>{{obtenerNombre()}}</dd>

    <dt>Nombre Capitalizado: </dt>
    <dd>{{nombreCapitalizado}}</dd>
</dl>

<button (click)="cambiarTipo()" >Cambiar tipo</button>
<button (click)="cambiarNombre()">Cambiar nombre</button>
