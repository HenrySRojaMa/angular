<table class="table table-striped table-hover table-borderless align-middle">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Bandera</th>
            <th>Nombre</th>
            <th>Población</th>
            <th>Info</th>
        </tr>
    </thead>
    <tbody class="table-group-divider">
        <tr *ngFor="let item of paises; let i=index">
            <td>{{i+1}}</td>
            <td>
                <img [src]="item.flags.png" class="img-fluid rounded-top" [alt]="item.name.official" />
            </td>
            <td>{{item.capital[0]}},{{item.name.official}}</td>
            <td>{{item.population}}</td>
            <td><a [routerLink]="['/pais',item.cca2]">ver...</a></td>
        </tr>
    </tbody>
    <tfoot>

    </tfoot>
</table>
