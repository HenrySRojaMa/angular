<h2>Por País</h2>

<app-pais-input placeHolder="Buscar por pais..." (onEnter)="buscar($event)" (onDebounce)="sugerir($event)"></app-pais-input>

<hr>

<div class="alert alert-danger" role="alert" *ngIf="error">
    <strong>Eres loco?!</strong> Que chucha es eso de {{query}}?!
</div>

<div class="table-responsive-sm" *ngIf="!error">
    <app-pais-tabla [paises]="paises"></app-pais-tabla>
</div>
